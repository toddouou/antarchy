[package]
name    = "hive-sim"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "hive-sim"
path = "src/main.rs"

[dependencies]
tokio             = { version = "1",    features = ["full"] }
axum              = { version = "0.7",  features = ["ws"] }
serde             = { version = "1",    features = ["derive"] }
serde_json        = "1"
rayon             = "1"
rustc-hash        = "1"
smallvec          = "1"
base64            = "0.22"
sha2              = "0.10"
hex               = "0.4"
once_cell         = "1"
futures-util      = "0.3"
rand              = "0.8"
parking_lot       = "0.12"
tokio-tungstenite = "0.23"
flate2            = "1"

[profile.release]
opt-level      = 3
lto            = "thin"
codegen-units  = 1
