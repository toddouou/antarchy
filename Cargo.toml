[package]
name    = "hive-sim"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "hive-sim"
path = "src/main.rs"

[dependencies]
tokio             = { version = "1",    features = ["full"] }
axum              = { version = "0.7",  features = ["ws"] }
serde             = { version = "1",    features = ["derive"] }
serde_json        = "1"
rayon             = "1"
rustc-hash        = "1"
base64            = "0.22"
sha2              = "0.10"
# HMAC-SHA256 for verifying Stripe webhook signatures (the `Stripe-Signature` header). Pairs with
# the existing `sha2` digest + `subtle` constant-time compare; no system libs.
hmac              = "0.12"
hex               = "0.4"
# Password hashing (OWASP A07): Argon2id KDF + constant-time compare for the legacy SHA-256 fallback.
# Pure-Rust, no system libs; argon2 re-exports the `password_hash` PHC types it needs.
argon2            = "0.5"
subtle            = "2"
once_cell         = "1"
futures-util      = "0.3"
rand              = "0.8"
parking_lot       = "0.12"
tokio-tungstenite = "0.23"
# Raw-DEFLATE for the WS egress hot path (network.rs). `zlib-rs` backend (pure-Rust, no C) encodes
# faster than the default miniz_oxide at identical level-9 raw-deflate output, buying CPU headroom on
# the viewport thread; the browser's DecompressionStream('deflate-raw') is unchanged.
flate2            = { version = "1", default-features = false, features = ["zlib-rs"] }
# bincode 2 (serde bridge → keeps the existing #[derive(Serialize, Deserialize)] on snapshot structs).
bincode           = { version = "2", features = ["serde"] }
# Snapshot compression: zstd (level 3) beats gzip on both ratio and speed → smaller world.snapshot,
# faster encode/restore. Off the wire (browsers can't natively inflate zstd) — disk persistence only.
zstd              = "0.13"
png               = "0.17"
# R2 / S3-compatible object store upload (Phase 6 snapshot tiles). Always compiled so the upload
# path is compile-verified; activation is gated at runtime on SNAPSHOT_CDN + env creds. rustls TLS
# to avoid a system OpenSSL dependency on the build host.
rust-s3           = { version = "0.37", default-features = false, features = ["tokio-rustls-tls"] }
# beta-v2 transactional email (Resend HTTPS POST). rustls to match the no-system-OpenSSL stance above;
# shares the rustls/hyper stack already pulled by rust-s3 + tokio. Dormant until HIVE_RESEND_API_KEY set.
reqwest           = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# RAM lever: jemalloc as the global allocator on the production (Linux) host. glibc's malloc holds
# freed pages (it grows arenas and rarely returns memory to the OS), so RSS ratchets up as 24 h ant
# trails paint and clear chunks even though live tile RAM is flat — exactly the "70% and climbing"
# symptom. jemalloc's per-size-class decay returns dirty pages to the OS within seconds, flattening
# RSS, at the cost of a little background CPU (which the box has to spare). Unix-only so the Windows
# (MSVC) dev build keeps the system allocator and never tries to compile jemalloc.
[target.'cfg(unix)'.dependencies]
tikv-jemallocator = "0.6"

[profile.release]
opt-level      = 3
lto            = "thin"
codegen-units  = 1
